name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tracked files
        run: npm run check:repository
      - name: Verify root lockfile
        run: npm ci --ignore-scripts
      - name: Audit root package
        run: npm audit --audit-level=high

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mj_shoot-it
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mj_shoot-it/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Install browser for gallery workflow tests
        run: npx playwright install --with-deps chromium
      - name: Test photographer and client workflows
        run: npm run test:workflow

  migrations:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mjstudio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mjstudio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply all database migrations
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mjstudio_test
        run: npm run migrate
      - name: Verify migration readiness
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mjstudio_test
        run: npm run migrate:check
      - name: Test PostgreSQL gallery journey
        working-directory: backend
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mjstudio_test
        run: npm run test:database
