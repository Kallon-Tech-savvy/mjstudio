name: Temporary Sharp dependency bootstrap

on:
  push:
    branches:
      - tooling/sharp-lockfile

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated tooling branch
        uses: actions/checkout@v4
        with:
          ref: tooling/sharp-lockfile
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and install Sharp
        working-directory: backend
        run: npm install sharp
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files are already up to date."
            exit 0
          fi
          git commit -m "chore(backend): add Sharp image processing dependency"
          git push origin HEAD:tooling/sharp-lockfile
